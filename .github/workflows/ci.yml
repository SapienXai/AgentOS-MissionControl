name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Generate Next.js route types
        run: pnpm typegen

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build

      - name: Run release consistency check
        run: pnpm check:release

  desktop-native-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop TypeScript checks
        run: pnpm desktop:typecheck

      - name: Check native formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build desktop binary
        run: pnpm desktop:build:binary

  desktop-packaging:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop packages
        run: pnpm desktop:build

      - uses: actions/upload-artifact@v6
        with:
          name: agentos-desktop-${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error

  openclaw-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            target: test-gateway-stable
            allow_failure: false
          - channel: beta
            target: test-gateway-beta
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenClaw compatibility report
        run: pnpm openclaw:compat -- --target ${{ matrix.target }} --json-output .compat/openclaw-${{ matrix.channel }}.json

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: openclaw-compat-${{ matrix.channel }}
          path: .compat/openclaw-${{ matrix.channel }}.json
          if-no-files-found: warn

  mission-control-browser-smoke:
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AgentOS
        run: pnpm build

      - name: Run Mission Control browser smoke
        shell: bash
        env:
          AGENTOS_SMOKE_BASE_URL: http://127.0.0.1:3000
          AGENTOS_SMOKE_ALLOW_DATA_BLOCKED: "1"
          AGENTOS_SMOKE_JSON_OUTPUT: .smoke/mission-control-smoke.json
        run: |
          mkdir -p .smoke
          export AGENTOS_API_TOKEN="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          pnpm start > .smoke/agentos-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          node <<'EOF'
          const baseUrl = process.env.AGENTOS_SMOKE_BASE_URL;
          const deadline = Date.now() + 60_000;

          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${baseUrl}/api/snapshot?force=true`);
              if (response.ok || response.status === 401) {
                process.exit(0);
              }
            } catch {
              // Retry until the server accepts connections.
            }

            await new Promise((resolve) => setTimeout(resolve, 1_000));
          }

          console.error(`AgentOS server did not become reachable at ${baseUrl}.`);
          process.exit(1);
          EOF

          pnpm smoke:mission-control

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mission-control-browser-smoke
          path: .smoke/*
          if-no-files-found: warn
