name: OpenClaw Release Watch

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      target_version:
        description: "Optional exact OpenClaw version to review"
        required: false
        type: string
      include_prerelease:
        description: "Allow an explicit prerelease target"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Generate artifacts without creating or updating a GitHub issue"
        required: false
        default: false
        type: boolean
      force_refresh:
        description: "Bypass the local contract-diff cache"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: write

concurrency:
  group: openclaw-release-watch
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenClaw upstream intake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENCLAW_WATCH_TARGET_VERSION: ${{ inputs.target_version }}
          OPENCLAW_WATCH_INCLUDE_PRERELEASE: ${{ inputs.include_prerelease }}
          OPENCLAW_WATCH_DRY_RUN: ${{ inputs.dry_run }}
          OPENCLAW_WATCH_FORCE_REFRESH: ${{ inputs.force_refresh }}
          OPENCLAW_WATCH_OUTPUT_DIR: ${{ github.workspace }}/.openclaw-release-intake
        run: pnpm openclaw:release-watch

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: openclaw-release-intake
          path: .openclaw-release-intake/*
          if-no-files-found: warn
          retention-days: 14
