<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentOS</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #090b12; color: #f8fafc; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 25%, #242044 0, #090b12 58%); }
      main { width: min(28rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid rgba(255,255,255,.12); border-radius: 1rem; background: rgba(15, 18, 30, .84); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      h1 { margin: 0 0 .75rem; font-size: 1.25rem; letter-spacing: -.02em; }
      p { margin: 0; color: rgba(226,232,240,.72); font-size: .9rem; line-height: 1.5; }
      [data-error] { color: #fda4af; }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <h1>AgentOS</h1>
      <p id="status">Starting AgentOS…</p>
    </main>
    <script>
      const error = new URLSearchParams(location.search).get("error");
      if (error) {
        const status = document.getElementById("status");
        status.textContent = error;
        status.dataset.error = "true";
      }
    </script>
  </body>
</html>
